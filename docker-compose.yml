services:
  db:
    image: mysql:8.0
    container_name: crenelio-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: crenelio
      MYSQL_USER: crenelio
      MYSQL_PASSWORD: crenelio_dev
      MYSQL_ROOT_PASSWORD: crenelio_root
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed_init.sql:/docker-entrypoint-initdb.d/02-seed-init.sql:ro
      - ./sql/seed_test_data.sql:/docker-entrypoint-initdb.d/03-seed-test-data.sql:ro
      - db_data:/var/lib/mysql

  api:
    image: php:8.2-apache
    container_name: crenelio-api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: crenelio
      DB_USER: crenelio
      DB_PASS: crenelio_dev
      APP_ENV: development
      CORS_ORIGIN: "*"
      # Emails locaux capturés par Mailpit (http://localhost:8025) : rien ne part vers l'extérieur.
      # Ces variables priment sur api/.env ; les retirer pour tester un vrai serveur SMTP.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: none
      SMTP_USER: ""
      MAIL_FROM: no-reply@crenelio.local
      MAIL_FROM_NAME: Crénelio (local)
      APP_URL: http://localhost:5173
    depends_on:
      - db
      - mailpit
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql &&
             a2enmod rewrite &&
             sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
             apache2-foreground"

  # Serveur SMTP de capture pour le développement : interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: crenelio-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
